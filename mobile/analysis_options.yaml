include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

  errors:
    # مقایسه‌ی نوع‌های ناسازگار و مقدار null نادیده‌گرفته‌شده، خطا باشد نه هشدار
    invalid_assignment: error
    argument_type_not_assignable: error
    return_of_invalid_type: error
    unused_import: warning
    dead_code: warning

    # این قاعده در پروژه‌ای که چند نسخه‌ی Flutter را پشتیبانی می‌کند سر و صدا
    # می‌سازد: از APIهایی استفاده می‌کنیم که در نسخه‌های جدید منسوخ شده‌اند
    # ولی جایگزینشان در نسخه‌ی حداقلی ما وجود ندارد.
    deprecated_member_use: info

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_unnecessary_containers
    - await_only_futures
    - camel_case_types
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - empty_catches
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sized_box_for_whitespace
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_null_checks
    - use_build_context_synchronously
    - use_super_parameters
