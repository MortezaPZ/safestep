name: safestep
description: "هم‌قدم (SafeStep) — اپلیکیشن پایش ایمن و حفظ استقلال افراد دارای نیاز مراقبتی ویژه"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ── محلی‌سازی ──────────────────────────────────────────────────────────
  # ترجمه‌های آماده‌ی ویجت‌های خودِ Flutter (تقویم، دیالوگ‌ها، جهت متن).
  # بدون این، حتی با تنظیم Locale، دکمه‌های سیستمی انگلیسی می‌مانند.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # ── مدیریت حالت ───────────────────────────────────────────────────────
  # انتخاب: Riverpod. دلیل کامل در docs/phase1/03-flutter-foundation.md
  flutter_riverpod: ^2.5.1

  # ── ناوبری ────────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── ذخیره‌سازی محلی ───────────────────────────────────────────────────
  # ترجیحات غیرحساس (تم، بزرگ‌نمایی متن) در SharedPreferences
  shared_preferences: ^2.2.3
  # توکن‌ها در Keychain/Keystore — نه در SharedPreferences (گام ۴)
  flutter_secure_storage: ^9.2.2

  # ── تاریخ شمسی ────────────────────────────────────────────────────────
  # تبدیل دقیق میلادی↔شمسی. پیاده‌سازی دستی این تبدیل، منبع همیشگی
  # خطای یک‌روزه در مرز سال است؛ ارزش یک وابستگی سبک را دارد.
  shamsi_date: ^1.0.4

  # ── شبکه (گام ۴ به بعد) ───────────────────────────────────────────────
  dio: ^5.5.0
  socket_io_client: ^2.0.3+1

  # ── موقعیت‌یابی و حسگرها (گام ۵ به بعد) ───────────────────────────────
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  flutter_foreground_task: ^6.5.0
  battery_plus: ^6.0.2
  connectivity_plus: ^6.0.5
  sqflite: ^2.3.3
  path: ^1.9.0

  # ── نقشه و QR (گام ۴ و ۶) ─────────────────────────────────────────────
  google_maps_flutter: ^2.7.0
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # ── ابزار ─────────────────────────────────────────────────────────────
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  uuid: ^4.4.2
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # ── فونت وزیرمتن ──────────────────────────────────────────────────────
  # فایل‌های TTF داخل مخزن‌اند و از شبکه دانلود نمی‌شوند: اپ باید در اولین
  # اجرا و بدون اینترنت هم درست نمایش داده شود. استفاده از سرویس فونت
  # آنلاین یعنی اولین صفحه‌ای که کاربر می‌بیند، با فونت پیش‌فرض سیستم
  # رندر شود — که برای فارسی نتیجه‌ی بدی می‌دهد.
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
